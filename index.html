<title>안산살이 Ansan Life</title>

<style>
/* Layout: one phone-sized app; on desktop it sits in a framed device on a white backdrop */
:root{
  --bg:#F3F2EF; --sheet:#FFFFFF; --ink:#1E2221; --muted:#6E7472; --hair:#DCDCD8;
  --deep:#22393A; --sage:#8FA7AC; --accent:#E45C4E; --accent-soft:#FBE7E4;
  --gen:#3A4442; --food:#EE8A3C; --rec:#4E8F87; --bus:#2F8F5B; --l4:#00A5DE; --sb:#F5A200; --sh:#8FC31F; --walk:#A3A8A6;
  --backdrop:#FFFFFF;
  --serif:"Playfair Display","Noto Serif KR",Georgia,serif;
  --serif-ko:"Noto Serif KR","Playfair Display",serif;
  --sans:"Quicksand","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ko:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--backdrop);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* stage + device */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px}
#phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #1B2526,0 30px 80px rgba(20,35,36,.35);flex:none;transform-origin:center}
#aside{max-width:300px;display:flex;flex-direction:column;gap:14px;color:var(--deep)}
#aside h1{font-family:var(--serif-ko);font-size:40px;margin:0;line-height:1.1}
#aside p{margin:0;font-size:14px;line-height:1.6;color:#41534F}
#aside .beta{display:inline-block;margin-left:4px;padding:3px 9px;border-radius:999px;background:#D9ECEA;color:#2E6B68;font-weight:700;letter-spacing:1.5px;vertical-align:1px}
#aside .betatag{font-family:var(--sans);font-size:11px;letter-spacing:3px;font-weight:700;text-transform:uppercase}
#aside .lead{margin-top:10px;letter-spacing:-0.025em;white-space:pre-line} /* 제목과 24px (flex gap 14 + 10) */
@media (max-width:820px){#aside{display:none}}
@media (max-width:500px){
  body{background:var(--bg)}
  #stage{padding:0;display:block}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
}
#app{position:absolute;inset:0;overflow:hidden}

/* screen scaffolding */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overflow-x:hidden;animation:in .28s ease both;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;gap:10px;padding:52px 22px 0;flex:none}
.nav .lbl{font-weight:500;font-size:14px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;margin:-8px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 10px 4px 4px;font-size:12px;font-weight:700}
.pflag{width:20px;height:20px;border-radius:50%;overflow:hidden;flex:none;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pflag svg{width:100%;height:100%}
.ttl{padding:20px 28px 22px;display:flex;flex-direction:column;gap:4px;flex:none}
.eyebrow{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}
.h1{font-family:var(--serif);font-weight:700;font-size:31px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.3px}
.ko .h1,.h1.ko{font-family:var(--serif-ko)}
.sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kr{font-family:var(--ko)}
.sheet{flex:1 0 auto;background:var(--sheet);border-top-left-radius:48px;padding:26px 24px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
/* Naver-map card rows keep one height whatever the language */
.card.row.fixh{height:76px;flex:none;overflow:hidden}
.card.row.fixh .col{overflow:hidden}
.card.row.fixh .serif,.card.row.fixh .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card.row.fixh .lines{flex-wrap:nowrap;overflow:hidden}
/* hospitals & pharmacies */
.mtabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:none;margin:0 -24px;padding:0 24px}
.mtabs::-webkit-scrollbar{display:none}
.mtab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--muted);white-space:nowrap;padding:4px 0}
.mtab i{display:block;height:2px;width:0;background:var(--accent);border-radius:1px;transition:width .2s}
.mtab[aria-selected="true"]{color:var(--ink);font-weight:600}
.mtab[aria-selected="true"] i{width:18px}
.mtab sup{font-size:10px;color:var(--muted);font-weight:500;margin-left:2px}
.mrow{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.mrow .nm{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.mrow .nm::before{content:"";width:16px;height:1.5px;background:var(--ink);flex:none;align-self:flex-start;margin-top:12px}
.mrow .nm b{font-family:var(--serif-ko);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .ticket{width:100%;padding:12px 12px 12px 16px}
.mstat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.mstat .dot{width:7px;height:7px}
.mstat.open{color:#1F7A55}.mstat.open .dot{background:#2FA36B}
.mstat.closed{color:var(--muted)}.mstat.closed .dot{background:#B9C2BE}
.macts{display:flex;gap:8px;flex:none}
.macts .idot{width:40px;height:40px}
.mskel{height:118px;border-radius:20px;background:linear-gradient(90deg,var(--bg) 0,#ECEBE7 50%,var(--bg) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.hrs .td{font-weight:700;color:var(--ink)}
.hrs span:nth-child(odd){color:var(--muted)}
.hrs span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.h2{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:17px}
.h2 .k{font-family:var(--ko);font-weight:400;font-size:11px;color:var(--muted)}
.h2 .ln{flex:1;height:1px;background:var(--ink);opacity:.25}
.muted{color:var(--muted)}
.small{font-size:12px}.tiny{font-size:11px}.micro{font-size:10px}
.b{font-weight:700}
.card{background:var(--bg);border-radius:20px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.idot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.btn{height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:15px;width:100%}
.btn.dark{background:var(--deep);color:#fff}
.btn.line{background:#fff;border:1px solid var(--hair)}
.btn.sq{width:54px;flex:none}
.btn[disabled]{background:#ECEDEB;color:#A3A8A6;cursor:not-allowed}
.acts{display:flex;gap:10px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;background:#fff;color:var(--deep)}
.badge{border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.hair{height:1px;background:var(--ink);opacity:.12}
.ticket{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:14px 16px}
.dash{width:0;align-self:stretch;border-left:1px dashed rgba(30,34,33,.3)}
.cap{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.serif{font-family:var(--serif);font-weight:700}
.it{font-family:var(--serif);font-style:italic}
.accent{color:var(--accent)}
.soft-accent{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.toggle{width:44px;height:26px;border-radius:13px;background:#D5D8D6;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:21px}

/* intro */
.intro{background:#fff}
.hero{position:relative;flex:1 0 auto;min-height:640px;border-bottom-right-radius:120px;overflow:hidden;color:var(--deep)}
.bgl{position:absolute;inset:0;background-size:cover;background-position:center 60%;transition:opacity 1.8s ease}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to bottom,rgba(22,41,42,0),rgba(22,41,42,.45) 35%,rgba(18,34,36,.88))}
.hero-in{position:relative;height:100%;display:flex;flex-direction:column;padding:72px 0 30px}
.toprule{display:flex;align-items:center;gap:10px;padding:0 32px}
.toprule i{display:block;width:120px;height:1px;background:var(--deep);opacity:.55}
.welcome{padding:24px 32px 0}
.in{width:100%;border:1px solid transparent;background:var(--bg);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);outline:none;min-width:0}
.in:focus{border-color:var(--deep);background:#fff}
textarea.in{resize:vertical;line-height:1.6}
.bd-form .in{background:#fff}
.btn.sm{height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.cn-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--bg);text-align:left}
.cn-t{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cn-pin{color:var(--accent);font-size:9px;margin-right:5px;vertical-align:2px}
.cn-tr{font-size:12px;color:var(--ink);opacity:.75;line-height:1.4}
.bd-item{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;padding:14px 16px;border-radius:16px;background:var(--bg)}
.bd-t,.bd-h{font-family:var(--sans);font-size:18px;font-weight:700;line-height:1.4;letter-spacing:-.02em;word-break:break-word}.bd-h{margin:0}
.bd-ex{font-size:13px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-line}
.bd-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.bd-who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.bd-who b{color:var(--ink);font-weight:700}
.bd-ip{font-size:11px}
.bd-fl{width:16px;height:16px;border-radius:50%;overflow:hidden;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bd-fl svg{width:100%;height:100%}
#bdwf .bd-fl{width:24px;height:24px}
.bd-c,.bd-tr{display:inline-flex;align-items:center;gap:3px}
.bd-body{letter-spacing:-.02em;white-space:pre-line;line-height:1.75;font-size:15px;word-break:break-word}
.bd-cmt{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.bd-cb{letter-spacing:-.02em;white-space:pre-line;font-size:14px;line-height:1.6;word-break:break-word}
.bd-ask{display:flex;gap:6px;align-items:center}.bd-ask .in{flex:1;min-width:0}
.bd-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0;text-align:center}
.bnwrap{position:relative;margin:0 0 8px}
.bntrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;gap:0}
.bntrack::-webkit-scrollbar{display:none}
.bn{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:3/1;border-radius:12px;overflow:hidden;display:block;text-decoration:none;color:inherit}
.bn.img{background:#E9ECEA}
.bn.img img{width:100%;height:100%;object-fit:cover;display:block}
.bn.img .bn-chip{position:absolute;left:10px;top:10px;background:rgba(30,34,33,.62);color:#fff}
.bn.txt{background:var(--deep);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px}
.bn-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.bn-chip{align-self:flex-start;display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.bn-t{font-family:var(--serif);font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn-t.kr{font-family:var(--serif-ko)}
.bn-s{font-size:12px;opacity:.82;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bn-go{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.bndots{position:absolute;right:10px;bottom:8px;display:flex;gap:4px}
.bndots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.bndots i.on{background:#fff;width:14px;border-radius:3px}
.adcard,.instcard{border-radius:12px}
.roma{display:block;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:1px}
.roma.big{font-size:13px;margin-top:-2px}
.roma-in{opacity:.75}
.tag.dept{display:inline-flex;gap:5px;align-items:baseline}
.tag.dept .kr{font-size:10px;color:var(--muted);font-weight:500}
.instcard{position:relative;background:#fff;border:1px solid var(--hair);padding:14px 30px 14px 14px;gap:12px}
.instcard .appic{width:32px;height:32px;border-radius:8px;flex:none;object-fit:cover}
.instcard .grow{padding-right:4px}
.instbtn{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.instx{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.instx:hover{background:rgba(0,0,0,.05)}
.welcome .w{font-family:var(--serif);font-style:italic;font-size:20px;opacity:.85}
.welcome .t{font-family:var(--serif-ko);font-weight:700;font-size:48px;letter-spacing:-1px;line-height:1.2}
.welcome .s{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:4px;opacity:.8;display:flex;gap:8px;align-items:center}
.welcome .s em{font-family:var(--serif);letter-spacing:0;font-size:13px}
.q{padding:22px 32px 0}
.q i{display:block;width:28px;height:1.5px;background:var(--deep);margin-bottom:14px}
.q b{font-family:var(--serif-ko);font-size:20px;display:block}
.q span{font-family:var(--serif);font-style:italic;font-size:14px}
.rail{margin-top:auto;display:flex;align-items:flex-end;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:32px;padding:30px 80px 4px 32px;scrollbar-width:none;min-height:160px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.rail.dragging{cursor:grabbing;scroll-snap-type:none}
.rail.dragging .cc{pointer-events:none}
.cc img,.cc svg{-webkit-user-drag:none;pointer-events:none}
/* press (touchdown) + hover feedback on every control */
.fx{transition:transform .14s ease,filter .14s ease,box-shadow .2s ease,background-color .2s ease}
.fx.is-pressed{transform:scale(.97);filter:brightness(.94)}
.btn.fx.is-pressed,.go.fx.is-pressed{transform:scale(.96)}
.toc .fx.is-pressed,.listrow.fx.is-pressed{transform:none;filter:none;background:rgba(30,34,33,.05);border-radius:12px}
.toc .fx.is-pressed .idot,.listrow.fx.is-pressed .bag{transform:scale(1.08)}
.toc .idot,.listrow .bag{transition:transform .14s ease}
.opt.fx.is-pressed,.choice.fx.is-pressed,.qopt.fx.is-pressed,.card.fx.is-pressed,.ticket.fx.is-pressed{transform:translateY(-3px) scale(.99);box-shadow:0 10px 22px rgba(30,34,33,.12);filter:none}
.shutter.fx.is-pressed i{transform:scale(.88)}
.shutter i{transition:transform .14s ease}
.cc.is-pressed{transform:translateY(-12px) rotate(-1.5deg)}
.cc.is-pressed ~ .cc{transform:translateX(30px)}
@media (hover:hover){
 .cc:hover{transform:translateY(-12px) rotate(-1.5deg)}
 .cc:hover ~ .cc{transform:translateX(30px)}
 .fx:not(.cc):hover{filter:brightness(.97)}
 .opt.fx:hover,.choice.fx:hover,.qopt.fx:hover,.card.fx:hover,.ticket.fx:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,34,33,.1);filter:none}
 .toc .fx:hover .idot,.listrow.fx:hover .bag{transform:scale(1.08)}
 .toc .fx:hover,.listrow.fx:hover{filter:none}
}
.rail.dragging .cc{transform:none!important}
@media (prefers-reduced-motion:reduce){.fx,.cc{transition:none}}
.rail::-webkit-scrollbar{display:none}
.cc{position:relative;flex:none;width:132px;height:116px;border-radius:20px;margin-left:-34px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:-10px 6px 24px rgba(13,26,26,.28);scroll-snap-align:start;transition:height .25s,width .25s,background .25s,transform .25s}
.cc:first-child{margin-left:0}
.cc .fl{width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cc .num{position:absolute;right:14px;top:22px;font-family:var(--serif);font-style:italic;font-size:13px;opacity:.85}
.cc .nm{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.15}
.cc .nm.zh{font-family:"Noto Serif KR",serif;font-size:19px}
.cc .nm.cy{font-family:"Noto Serif KR",Georgia,serif}
.cc .kk{font-family:var(--ko);font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc[aria-pressed="true"]{width:140px;height:128px;background:rgba(255,255,255,.95);color:var(--deep);z-index:5;box-shadow:-10px 6px 24px rgba(13,26,26,.38)}
.cc[aria-pressed="true"] .num{display:none}
.cc .chk{position:absolute;right:14px;top:18px;width:24px;height:24px;border-radius:12px;background:var(--accent);display:none;place-items:center}
.cc[aria-pressed="true"] .chk{display:grid}
.locrow{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 0;color:#fff;font-size:13px;font-weight:500}
.swipe{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;margin-right:40px}
.swipe i{display:block;width:56px;height:2px;background:rgba(255,255,255,.3);position:relative;overflow:hidden;border-radius:1px}
.swipe i b{position:absolute;left:0;top:0;height:2px;width:20px;background:#fff;transition:left .2s}
.cont{display:flex;align-items:center;justify-content:space-between;padding:26px 32px calc(30px + env(safe-area-inset-bottom,0px));flex:none}
.cont .l b{font-family:var(--serif);font-size:22px;display:block}
.cont .l.ko b{font-family:var(--serif-ko);font-size:20px}

/* 지도 위 한 손가락은 페이지 스크롤, 두 손가락으로 지도 이동·확대 (QA 9번). 지도 자체 제스처는 끄고 투명한 막이 받아서 처리 */
const MAPHINT={ko:'두 손가락으로 지도를 움직여요',en:'Use two fingers to move the map',vi:'Dùng hai ngón tay để di chuyển bản đồ',zh:'用两根手指移动地图',ru:'Двигайте карту двумя пальцами',uz:'Xaritani ikki barmoq bilan suring',mn:'Газрын зургийг хоёр хуруугаар хөдөлгөнө үү'};
function mapShield(el){if(el.querySelector('.mshield'))return;const sh=document.createElement('div');sh.className='mshield';const hint=document.createElement('div');hint.className='mhint';hint.textContent=MAPHINT[st.lang]||MAPHINT.en;el.append(sh,hint);
 const ps=new Map();let mid=null,dist=0,scale=1,start=null,moved=false,hintT;
 const showHint=()=>{hint.classList.add('on');clearTimeout(hintT);hintT=setTimeout(()=>hint.classList.remove('on'),1400);};
 const two=()=>{const v=[...ps.values()];return {x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2,d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)};};

  if(ps.size===1){start={x:e.clientX,y:e.clientY,t:Date.now(),mouse:e.pointerType==='mouse'};moved=false;mid={x:e.clientX,y:e.clientY};}
  if(ps.size===2){const g=two();mid=g;dist=g.d;scale=1;moved=true;}});
 sh.addEventListener('pointermove',e=>{if(!ps.has(e.pointerId))return;ps.set(e.pointerId,{x:e.clientX,y:e.clientY});const c=el._ctl;if(!c)return;
  if(ps.size===2){e.preventDefault();const g=two();c.pan(g.x-mid.x,g.y-mid.y);mid=g;if(dist)scale=g.d/dist;return;}
  if(ps.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)moved=true;
   if(start.mouse){c.pan(e.clientX-mid.x,e.clientY-mid.y);mid={x:e.clientX,y:e.clientY};} // 데스크톱 마우스는 끌어서 이동
   else if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy))showHint();}});

function askGps(explicit){const pref=gpsPref();if(pref==='on')return Promise.resolve(true);if(pref==='off'&&!explicit)return Promise.resolve(false);
 return new Promise(res=>{const p=PT();const o=document.createElement('div');o.className='sheetover';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',p.t);
  o.innerHTML=`<div class="bs"><span class="grab"></span><span class="eyebrow">${ic('spot',13,'#E45C4E')} GPS</span><span class="h1 ${isKo()?'ko':''}" style="font-size:24px">${p.t}</span><span class="small muted" style="line-height:1.55">${p.lead}</span>
   <div class="card col" style="gap:8px;padding:14px 16px">${[p.sent,p.to,p.keep].map(x=>`<span class="row small" style="gap:8px;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px;flex:none"></span><span style="line-height:1.5">${x}</span></span>`).join('')}</div>
   <span class="row tiny" style="gap:12px;flex-wrap:wrap"><a href="privacy.html" target="_blank" rel="noopener" style="text-decoration:underline">${p.privacy}</a><a href="location-terms.html" target="_blank" rel="noopener" style="text-decoration:underline">${p.terms}</a></span>
   <div class="acts"><button type="button" class="btn line" data-gps="no">${p.no}</button><button type="button" class="btn dark" data-gps="yes">${p.yes}</button></div></div>`;
  const done=v=>{setGps(v?'on':'off');o.remove();res(v);};
  o.addEventListener('click',e=>{const b=e.target.closest('[data-gps]');if(b)done(b.dataset.gps==='yes');else if(e.target===o)done(false);});
  app.appendChild(o);tagFx(o);});}

const RR_I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const RR_V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
// 받침: [단독 발음, 뒤에 ㅇ이 올 때 넘어가는 소리]
const RR_F=[['',''],['k','g'],['k','kk'],['k','gs'],['n','n'],['n','nj'],['n','nh'],['t','d'],['l','r'],['k','lg'],['m','lm'],['p','lb'],['t','ls'],['t','lt'],['p','lp'],['l','lh'],['m','m'],['p','b'],['p','bs'],['t','s'],['t','ss'],['ng','ng'],['t','j'],['t','ch'],['k','k'],['t','t'],['p','p'],['t','h']];
function roma(str){
 const cs=[...String(str||'')];const syl=cs.map(c=>{const n=c.charCodeAt(0)-0xAC00;return n>=0&&n<11172?{i:Math.floor(n/588),v:Math.floor(n%588/28),f:n%28}:null;});
 let out='';
 for(let k=0;k<cs.length;k++){const s=syl[k];if(!s){out+=cs[k];continue;}
  const prev=k>0?syl[k-1]:null;
  let ini=RR_I[s.i];
  if(prev){
   const pf=prev.f;
   if(s.i===11&&pf)ini=''; // 연음은 앞 받침 쪽에서 처리
   else if(s.i===5&&pf===8)ini='l'; // ㄹ+ㄹ → ll
   else if(s.i===5&&pf===4)ini='l';  // ㄴ+ㄹ → ll (신라 Silla)
   else if(s.i===5&&[16,21,1,17].includes(pf))ini='n'; // ㅁ·ㅇ·ㄱ·ㅂ+ㄹ → n (종로 Jongno)
   else if(s.i===2&&pf===8)ini='l'; // ㄹ+ㄴ → ll (설날 Seollal)
  }
  out+=ini+RR_V[s.v];
  if(s.f){const next=syl[k+1];let f=RR_F[s.f][0];
   if(next){
    if(next.i===11)f=RR_F[s.f][1]; // 연음
    else if(next.i===2||next.i===6||(next.i===5&&(f==='k'||f==='p'))){ if(f==='k')f='ng';else if(f==='p')f='m';else if(f==='t')f='n';} // 비음화
    else if(next.i===5&&s.f===4)f='l'; // ㄴ+ㄹ
   }
   out+=f;}
 }
 return out.replace(/(^|[\s(·])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}

async function getPos(){if(window.isSecureContext&&navigator.geolocation&&await askGps(false)){try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:false,timeout:9000,maximumAge:300000}));return {lat:p.coords.latitude,lng:p.coords.longitude,src:'gps'};}catch(e){}}
 const ll=await homeLL();return ll?{...ll,src:'home'}:null;}
async function loadLangSet(){if(st.med.langSet)return;try{const r=await fetch('data/lang_hospitals.json',{cache:'no-cache'});const j=await r.json();st.med.langSet=(j.hospitals||[]).map(x=>({n:normName(x.name),langs:x.langs||[]}));}catch(e){st.med.langSet=[];}}
async function loadMed(force){const m=st.med;if(!document.getElementById('medlist'))return;
 if(!hasApi()){m.err='noapi';paintMed();return;}
 if(!force&&m.hosp&&Date.now()-m.at<300000){paintMed();return;}
 if(m.loading)return;m.loading=true;m.err=null;paintMed();
 try{const [pos]=await Promise.all([getPos(),loadLangSet()]);if(!pos)throw new Error('pos');m.pos=pos;paintMed();
  const q=`lat=${pos.lat.toFixed(5)}&lng=${pos.lng.toFixed(5)}`;
  const [h,p]=await Promise.allSettled([api(`/med/nearby?kind=hosp&${q}`),api(`/med/nearby?kind=pharm&${q}`)]);
  if(h.status!=='fulfilled'&&p.status!=='fulfilled')throw new Error('api');
  m.hosp=h.status==='fulfilled'?(h.value.items||[]):[];m.pharm=p.status==='fulfilled'?(p.value.items||[]):[];m.at=Date.now();}
 catch(e){m.err='err';}
 finally{m.loading=false;paintMed();}}

 openNaver(`${RG().ko} ${it.name}`,it.lat!=null?'nmap://route/public?'+q.toString():null);}

st.ad={};
const sampleAd=()=>{const t=T();return `<div class="card row adcard"><div class="col grow" style="gap:3px"><span class="row cap" style="gap:6px"><span class="dot" style="background:var(--accent);width:6px;height:6px"></span>${t.sponsored}</span><span class="serif" style="font-size:15px">${t.adT}</span><span class="small muted">${t.adS}</span></div><span style="width:64px;height:64px;border-radius:14px;background:#FBE7D6;display:grid;place-items:center;flex:none">${ic('gift',22,'#9A6A44')}</span></div>`};
const directAd=a=>{const t=T();const img=a.image_url&&/^https:\/\//.test(a.image_url)?`<img src="${esc(a.image_url)}" alt="" style="width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none">`:`<span style="width:64px;height:64px;border-radius:14px;background:#FBE7D6;display:grid;place-items:center;flex:none">${ic('gift',22,'#9A6A44')}</span>`;
 const inner=`<div class="col grow" style="gap:3px"><span class="row cap" style="gap:6px"><span class="dot" style="background:var(--accent);width:6px;height:6px"></span>${t.adLbl}</span><span class="serif" style="font-size:15px">${esc(a.title)}</span>${a.body?`<span class="small muted">${esc(a.body)}</span>`:''}</div>${img}`;
 return a.url&&/^https:\/\//.test(a.url)?`<a class="card row adcard" href="${esc(a.url)}" target="_blank" rel="noopener sponsored">${inner}</a>`:`<div class="card row adcard">${inner}</div>`};
const adsenseBox=()=>`<div id="adslot" class="card adcard" style="padding:8px"><ins class="adsbygoogle" style="display:block" data-ad-client="${ADS_CLIENT}" data-ad-slot="${ADS_SLOT}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;

function adSlot(){if(adFree())return adFreeRow();if(!hasSb())return hasAdsense()?adsenseBox():sampleAd();const a=st.ad[st.lang];
 if(a===undefined)return '<div id="adslot"></div>';if(a)return directAd(a);
 return hasAdsense()?adsenseBox():(AD_PREVIEW?sampleAd():'');} /* QA 6: 실제 운영에선 예시 광고 숨김(애드센스 승인 전). 디자인 확인은 주소에 ?adpreview */
const pickAd=list=>{const tot=list.reduce((n,a)=>n+(a.weight||1),0);let r=Math.random()*tot;for(const a of list){r-=a.weight||1;if(r<=0)return a}return list[0]||null};
let adsenseLoaded=false;
function mountAdsense(){if(!document.querySelector('ins.adsbygoogle:not([data-adsbygoogle-status])'))return;
 if(!adsenseLoaded){adsenseLoaded=true;const sc=document.createElement('script');sc.async=true;sc.crossOrigin='anonymous';sc.src=`https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${ADS_CLIENT}`;document.head.appendChild(sc);}
 try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}
async function loadAd(){if(adFree())return;if(!hasSb()){if(hasAdsense())mountAdsense();return;}const lang=st.lang;
 if(st.ad[lang]===undefined){try{const list=await sb(`ads?select=id,title,body,url,image_url,weight&langs=cs.%7B${lang}%7D`);st.ad[lang]=pickAd(list||[]);}catch(e){st.ad[lang]=null;}
  const box=document.getElementById('adslot');if(box&&st.lang===lang){box.outerHTML=adSlot();tagFx(app);}}

/* 상단 배너: 지자체 행사·지역 광고 (Supabase banners). 지역 = 사용자 주소의 시·군(서울·광역시는 시·도), 비어 있으면 전국.
   여러 개면 가로로 넘기고 5초마다 자동으로 넘어감. 없으면 아무것도 안 보임 (디자인 확인은 주소에 ?adpreview) */
const BNL={ko:['행사','광고'],en:['Event','Ad'],vi:['Sự kiện','Quảng cáo'],zh:['活动','广告'],ru:['Событие','Реклама'],uz:['Tadbir','Reklama'],mn:['Арга хэмжээ','Зар']};
st.bn={};let bnTimer=null;
const bnKey=()=>RG().key||'전국';
const bnSample=()=>[{id:'sample',kind:'event',region:RG().key,title:'예시 · 안산 세계인 축제',sub:'예시 배너입니다. 지자체 행사를 받아 이 자리에 올려요.',title_en:'Sample · Ansan Global Festival',sub_en:'Example banner. City events go here.',image_url:null,url:null,ends_at:null}];
function bnText(b){const ko=isKo()||!b.title_en;return {title:ko?b.title:b.title_en,sub:ko?(b.sub||''):(b.sub_en||'')};}
function bnCard(b){const L=BNL[st.lang]||BNL.en,lab=b.kind==='ad'?L[1]:L[0],tx=bnText(b);const NEAR={ko:'내 근처',en:'Near you',vi:'Gần bạn',zh:'附近',ru:'Рядом',uz:'Yaqinda',mn:'Ойролцоо'};const rg=b.lat!=null?(NEAR[st.lang]||NEAR.en):b.region?(isKo()?RG().ko:(RG()[st.lang]||RG().en)):'';
 const chip=`<span class="bn-chip">${esc(lab)}${rg?` · ${esc(rg)}`:''}</span>`;
 const img=b.image_url&&/^https:\/\//.test(b.image_url);
 const inner=img?`<img src="${esc(b.image_url)}" alt="${esc(tx.title)}" loading="lazy">${chip}`
  :`<span class="bn-txt">${chip}<span class="bn-t ${isKo()||!b.title_en?'kr':''}">${esc(tx.title)}</span>${tx.sub?`<span class="bn-s">${esc(tx.sub)}</span>`:''}</span>${b.url?`<span class="bn-go">${ic('arrow',16,'#fff')}</span>`:''}`;
 const cls=`bn ${img?'img':'txt'}`;
 return b.url&&/^https:\/\//.test(b.url)?`<a class="${cls}" href="${esc(b.url)}" target="_blank" rel="noopener${b.kind==='ad'?' sponsored':''}">${inner}</a>`:`<div class="${cls}">${inner}</div>`;}
function topBanner(){const list=st.bn[bnKey()];if(list===undefined)return '<div id="bnslot"></div>';
 const show=list&&list.length?list:(AD_PREVIEW||!hasSb()?bnSample():[]);if(!show.length)return '<div id="bnslot"></div>';
 return `<div id="bnslot" class="bnwrap" role="region" aria-label="${esc((BNL[st.lang]||BNL.en)[0])}"><div class="bntrack">${show.map(bnCard).join('')}</div>${show.length>1?`<div class="bndots">${show.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>`;}
function bnMount(){clearInterval(bnTimer);const w=document.querySelector('.bnwrap');if(!w)return;const tr=w.querySelector('.bntrack'),dots=[...w.querySelectorAll('.bndots i')];if(dots.length<2)return;
 const idx=()=>Math.round(tr.scrollLeft/tr.clientWidth);let hold=false;
 tr.addEventListener('scroll',()=>{const i=idx();dots.forEach((d,k)=>d.classList.toggle('on',k===i));},{passive:true});
 ['pointerdown','touchstart'].forEach(ev=>tr.addEventListener(ev,()=>{hold=true;},{passive:true}));
 bnTimer=setInterval(()=>{if(hold||!tr.isConnected){if(!tr.isConnected)clearInterval(bnTimer);return;}const n=(idx()+1)%dots.length;tr.scrollTo({left:n*tr.clientWidth,behavior:'smooth'});},5000);}
/* 당근처럼 위치 기반: 배너에 중심 좌표 + 반경(km)이 있으면, 지금 위치(위치 사용을 켠 사람은 GPS, 아니면 집 주소)에서 그 반경 안일 때만 보임.
   좌표가 없는 배너는 지역(region) 규칙만 따름. 위치 확인 창은 여기서 새로 띄우지 않음 */
const kmBetween=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
async function bnPos(){if(gpsPref()==='on'&&window.isSecureContext&&navigator.geolocation){try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:false,timeout:6000,maximumAge:600000}));return {lat:p.coords.latitude,lng:p.coords.longitude};}catch(e){}}
 try{return await homeLL();}catch(e){return null;}}
async function loadBanners(){const key=bnKey();
 if(st.bn[key]===undefined){if(!hasSb()){st.bn[key]=[];}else{try{
   const cols='id,kind,region,title,sub,title_en,sub_en,image_url,url,ends_at,lat,lng,radius_km,sort';
   const pos=await bnPos();
   const byRegion=sb(`banners?select=${cols}&lat=is.null&or=(region.is.null,region.eq.${enc(RG().key)})&limit=8`).catch(()=>[]);
   // 반경 배너: 위치를 서버에 보내지 않도록 반경 배너 목록을 통째로 받아 기기 안에서 거리로 거름 (지역 칸은 상관없음)
   const near=pos?sb(`banners?select=${cols}&lat=not.is.null&order=sort.desc&limit=300`).catch(()=>[]):Promise.resolve([]);
   const [a,b]=await Promise.all([byRegion,near]);
   const inR=(b||[]).filter(x=>x.lat!=null&&x.lng!=null&&kmBetween(pos,{lat:x.lat,lng:x.lng})<=(x.radius_km||3)).map(x=>({...x,_d:kmBetween(pos,{lat:x.lat,lng:x.lng})}));
   // 가까운 동네 배너 먼저, 그다음 지역·전국 배너 (각각 sort 큰 순)
   st.bn[key]=[...inR.sort((x,y)=>(y.sort||0)-(x.sort||0)||x._d-y._d),...(a||[]).sort((x,y)=>(y.sort||0)-(x.sort||0))].slice(0,8);
  }catch(e){st.bn[key]=[];}}
  const box=document.getElementById('bnslot');if(box&&bnKey()===key){box.outerHTML=topBanner();tagFx(app);}}
 bnMount();}

/* downscale before upload: long side 1024px, JPEG */
function shrink(src,w,h,max=1024){const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82);}
function capture(){const v=document.getElementById('cv');if(!v||!v.videoWidth)return;st.photo=shrink(v,v.videoWidth,v.videoHeight);stopCam();go('w3');}
function readPhoto(f){const u=URL.createObjectURL(f);const im=new Image();
 im.onload=()=>{st.photo=shrink(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(u);go('w3')};
 im.onerror=()=>{URL.revokeObjectURL(u);const r=new FileReader();r.onload=()=>{st.photo=r.result;go('w3')};r.readAsDataURL(f)};im.src=u;}

/* ---------- photo analysis (server/analyze-worker.js) ---------- */
const DESTS=Object.keys(DEST);
const clip=v=>String(v||'').slice(0,60);
async function analyze(dataUrl){const m=/^data:([^;]+);base64,(.*)$/.exec(dataUrl||'');if(!m)return null;
 const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
 try{const r=await fetch(API_URL+'/analyze',{method:'POST',headers:apiHeaders({'content-type':'application/json'}),body:JSON.stringify({image:m[2],mediaType:m[1],lang:st.lang}),signal:ctl.signal});
  if(!r.ok)return null;const j=await r.json();if(!j||!DESTS.includes(j.dest))return null;
  return {dest:j.dest,name:clip(j.name),name_ko:clip(j.name_ko),confidence:Math.max(0,Math.min(1,+j.confidence||0)),
   candidates:(Array.isArray(j.candidates)?j.candidates:[]).filter(c=>c&&DESTS.includes(c.dest)).slice(0,3).map(c=>({dest:c.dest,name:clip(c.name),name_ko:clip(c.name_ko)}))};}
 catch(e){return null}finally{clearTimeout(to)}}

/* ---------- home address: GPS → Naver reverse geocoding, or typed address ---------- */
const inKoreaBox=(lat,lng)=>lat>33&&lat<38.7&&lng>124.5&&lng<131.9; // 키가 없을 때 대략적인 대한민국 범위
function revGeo(N,lat,lng){return new Promise(res=>{try{N.maps.Service.reverseGeocode({coords:new N.maps.LatLng(lat,lng),orders:'admcode,roadaddr,addr'},(s,r)=>{
  if(s!==N.maps.Service.Status.OK||!r||!r.v2)return res(null);const R=r.v2.results||[];
  const adm=R.find(x=>x.name==='admcode'),road=R.find(x=>x.name==='roadaddr'),jib=R.find(x=>x.name==='addr');const base=road||jib||adm;if(!base)return res(null);
  const g=base.region,L=base.land,num=L?`${L.number1||''}${L.number2?'-'+L.number2:''}`:'';
  const short=road&&L?`${L.name} ${num}`.trim():jib&&L?`${g.area3.name} ${num}`.trim():g.area3.name;
  const A=r.v2.address||{};
  res({inKorea:!!(g.area1&&g.area1.name),road:short,dong:adm?adm.region.area3.name:g.area3.name,full:A.roadAddress||A.jibunAddress||`${g.area1.name} ${g.area2.name} ${short}`,lat,lng});});}catch(e){res(null)}});}
function geoText(N,q){return new Promise(res=>{try{N.maps.Service.geocode({query:q},(s,r)=>res(s===N.maps.Service.Status.OK&&r&&r.v2&&r.v2.addresses&&r.v2.addresses[0]||null))}catch(e){res(null)}});}

 const msg=(m,err)=>{const e=o.querySelector('#lmsg');e.hidden=!m;e.textContent=m||'';e.classList.toggle('err',!!err)};

  if(!o.isConnected)return;const lat=pos.coords.latitude,lng=pos.coords.longitude;

  const hasArea=/(특별시|광역시|특별자치|[가-힣]+도(\s|$)|[가-힣]{1,}[시군](\s|$))/.test(v);const q=hasArea?v:`${RG().key} ${v}`;const N=await loadNaver();

const PRESS='button,a,label.shutter,label.idot,[data-go],[data-act],[data-naver],[data-sel],[data-ans],.cc,.choice,.opt,.qopt';
function tagFx(root){root.querySelectorAll(PRESS).forEach(n=>n.classList.add('fx'));}
new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches&&n.matches(PRESS))n.classList.add('fx');tagFx(n);}}))).observe(document.body,{childList:true,subtree:true});
let pressed=null,pressTimer=0;
const release=()=>{clearTimeout(pressTimer);if(pressed){const p=pressed;pressed=null;setTimeout(()=>p.classList.remove('is-pressed'),90);}};
document.addEventListener('pointerdown',e=>{const el=e.target.closest(PRESS);if(!el||el.disabled)return;release();pressed=el;el.classList.add('is-pressed');},{passive:true});
['pointerup','pointercancel','dragstart'].forEach(t=>document.addEventListener(t,release,{passive:true}));
document.addEventListener('scroll',release,{passive:true,capture:true});
document.addEventListener('pointermove',e=>{if(pressed&&e.pointerType!=='mouse'&&!pressed.contains(document.elementFromPoint(e.clientX,e.clientY)))release();},{passive:true});
document.addEventListener('touchstart',()=>{},{passive:true}); /* enables :active on iOS */

/* ---------- desktop fit + 안내 문구 ---------- */
function fit(){const ph=document.getElementById('phone');if(innerWidth<=500){ph.style.transform='';return}const s=Math.min(1,(innerHeight-48)/864);ph.style.transform=`scale(${s})`;ph.style.margin=`${-(844*(1-s))/2}px ${-(390*(1-s))/2}px`;}
addEventListener('resize',fit);fit();

render();
